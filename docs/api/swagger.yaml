  http.VerifyPhoneRequest:
    properties:
      phone:
        example: "+380991112233"
        type: string
    required:
    - phone
    type: object
  http.VerifyPhoneResponse:
    properties:
      code:
        example: "123456"
        type: string
      message:
        example: Код відправлено
        type: string

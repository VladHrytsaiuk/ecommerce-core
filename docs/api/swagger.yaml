basePath: /
definitions:
  github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Cart:
    properties:
      appliedPromoCode:
        type: string
      discountAmount:
        format: int64
        type: integer
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Item'
        type: array
      owner:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Owner'
      status:
        type: string
      updatedAt:
        type: string
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Item:
    properties:
      quantity:
        type: integer
      variantID:
        type: string
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Owner:
    properties:
      customerID:
        type: string
      sessionID:
        type: string
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.Code:
    enum:
    - INVALID_PAYLOAD
    - VALIDATION_FAILED
    - UNAUTHENTICATED
    - FORBIDDEN
    - RESOURCE_NOT_FOUND
    - CONFLICT
    - RATE_LIMITED
    - PAYLOAD_TOO_LARGE
    - SEARCH_UNAVAILABLE
    - INTERNAL_ERROR
    - NOT_IMPLEMENTED
    type: string
    x-enum-varnames:
    - CodeInvalidPayload
    - CodeValidationFailed
    - CodeUnauthenticated
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeRateLimited
    - CodePayloadTooLarge
    - CodeSearchUnavailable
    - CodeInternal
    - CodeNotImplemented
  github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.InvalidParam:
    properties:
      code:
        type: string
      field:
        type: string
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.PageMetadata:
    properties:
      facets:
        additionalProperties:
          additionalProperties:
            format: int64
            type: integer
          type: object
        description: |-
          Facets is populated by Search only. Keeping it in the standard metadata
          preserves one collection envelope for all v1 clients.
        type: object
      has_next:
        type: boolean
      has_previous:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.PaginatedResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.PageMetadata'
      request_id:
        type: string
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.ProblemDetails:
    properties:
      code:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.Code'
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.InvalidParam'
        type: array
      instance:
        type: string
      request_id:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_http_apiresponse.SuccessResponse:
    properties:
      data: {}
      request_id:
        type: string
    type: object
  github_com_VladHrytsaiuk_ecommerce-core_internal_orders_domain.StatusKind:
    enum:
    - payment
    - fulfillment
    - terminal
    - custom
    type: string
    x-enum-varnames:
    - StatusKindPayment
    - StatusKindFulfillment
    - StatusKindTerminal
    - StatusKindCustom
  github_com_VladHrytsaiuk_ecommerce-core_internal_orders_domain.TransitionTrigger:
    enum:
    - admin
    - system
    - payment_webhook
    - delivery_webhook
    - customer
    type: string
    x-enum-varnames:
    - TransitionTriggerAdmin
    - TransitionTriggerSystem
    - TransitionTriggerPaymentWebhook
    - TransitionTriggerDeliveryWebhook
    - TransitionTriggerCustomer
  github_com_VladHrytsaiuk_ecommerce-core_internal_returns_domain.ItemCondition:
    enum:
    - unopened
    - opened
    - damaged
    type: string
    x-enum-varnames:
    - ItemConditionUnopened
    - ItemConditionOpened
    - ItemConditionDamaged
  github_com_VladHrytsaiuk_ecommerce-core_internal_returns_domain.RefundMode:
    enum:
    - full
    - partial
    - store_credit
    type: string
    x-enum-varnames:
    - RefundModeFull
    - RefundModePartial
    - RefundModeStoreCredit
  internal_admin_delivery_http.badgeRequest:
    properties:
      color:
        type: string
      slug:
        type: string
      translations:
        items:
          $ref: '#/definitions/internal_admin_delivery_http.badgeTranslation'
        type: array
    type: object
  internal_admin_delivery_http.badgeTranslation:
    properties:
      locale:
        type: string
      name:
        type: string
    type: object
  internal_admin_delivery_http.cancelOrderRequest:
    properties:
      reason:
        maxLength: 2000
        type: string
    required:
    - reason
    type: object
  internal_admin_delivery_http.createProductOptionRequest:
    properties:
      name:
        maxLength: 100
        type: string
      position:
        minimum: 0
        type: integer
      values:
        items:
          $ref: '#/definitions/internal_admin_delivery_http.createProductOptionValue'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - name
    - values
    type: object
  internal_admin_delivery_http.createProductOptionValue:
    properties:
      position:
        minimum: 0
        type: integer
      value:
        maxLength: 255
        type: string
    required:
    - value
    type: object
  internal_admin_delivery_http.createProductVariantRequest:
    properties:
      barcode:
        type: string
      currency:
        type: string
      inventory_quantity:
        minimum: 0
        type: integer
      option_value_ids:
        items:
          type: string
        maxItems: 32
        minItems: 1
        type: array
      price_amount:
        minimum: 0
        type: integer
      sku:
        type: string
      status:
        type: string
      weight_grams:
        minimum: 0
        type: integer
    required:
    - currency
    - option_value_ids
    type: object
  internal_admin_delivery_http.createPromoRequest:
    properties:
      code:
        maxLength: 64
        type: string
      currency:
        type: string
      discount_type:
        type: string
      discount_value:
        type: integer
      is_active:
        type: boolean
      usage_limit:
        type: integer
      valid_until:
        type: string
    required:
    - code
    - discount_type
    - discount_value
    type: object
  internal_admin_delivery_http.orderWorkflowStatusRequest:
    properties:
      color:
        maxLength: 32
        type: string
      customer_label:
        maxLength: 128
        type: string
      description:
        maxLength: 4000
        type: string
      enabled:
        type: boolean
      is_initial:
        type: boolean
      is_terminal:
        type: boolean
      kind:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_orders_domain.StatusKind'
      name:
        maxLength: 128
        type: string
      sort_order:
        type: integer
    required:
    - kind
    - name
    type: object
  internal_admin_delivery_http.orderWorkflowTransitionRequest:
    properties:
      allowed_triggers:
        items:
          $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_orders_domain.TransitionTrigger'
        maxItems: 5
        minItems: 1
        type: array
      from_status_code:
        maxLength: 64
        type: string
      required_permission:
        maxLength: 128
        type: string
      requires_payment:
        type: boolean
      requires_reason:
        type: boolean
      requires_tracking_number:
        type: boolean
      to_status_code:
        maxLength: 64
        type: string
    required:
    - allowed_triggers
    - from_status_code
    - to_status_code
    type: object
  internal_admin_delivery_http.reviewStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  internal_admin_delivery_http.seoRequest:
    properties:
      description:
        type: string
      keywords:
        type: string
      locale:
        type: string
      og_image_ref:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      title:
        type: string
    required:
    - locale
    - resource_id
    - resource_type
    type: object
  internal_admin_delivery_http.transitionOrderRequest:
    properties:
      reason:
        maxLength: 2000
        type: string
      to_status_code:
        maxLength: 64
        type: string
      tracking_number:
        maxLength: 128
        type: string
    required:
    - to_status_code
    type: object
  internal_admin_delivery_http.updateProductVariantRequest:
    properties:
      barcode:
        type: string
      currency:
        type: string
      price_amount:
        minimum: 0
        type: integer
      sku:
        type: string
      status:
        type: string
      weight_grams:
        minimum: 0
        type: integer
    required:
    - currency
    type: object
  internal_availability_notifications_delivery_http.request:
    properties:
      email:
        maxLength: 320
        type: string
    type: object
  internal_cart_delivery_http.itemRequest:
    properties:
      quantity:
        type: integer
      variant_id:
        type: string
    required:
    - quantity
    - variant_id
    type: object
  internal_checkout_delivery_http.DeliveryDetails:
    properties:
      city:
        type: string
      country_code:
        type: string
      line1:
        type: string
      line2:
        type: string
      locality_id:
        type: string
      postal_code:
        type: string
      recipient_name:
        type: string
      recipient_phone:
        type: string
      service_point_id:
        type: string
    type: object
  internal_checkout_delivery_http.StartPaymentRequest:
    properties:
      cancel_url:
        type: string
      customer_email:
        type: string
      customer_phone:
        type: string
      delivery:
        $ref: '#/definitions/internal_checkout_delivery_http.DeliveryDetails'
      delivery_option_code:
        type: string
      delivery_provider:
        type: string
      return_url:
        type: string
    type: object
  internal_checkout_delivery_http.captureContactRequest:
    properties:
      cart_id:
        type: string
      email:
        type: string
      marketing_opt_in:
        type: boolean
    type: object
  internal_comparison_delivery_http.itemResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      product_variant_id:
        type: string
    type: object
  internal_comparison_delivery_http.listResponse:
    properties:
      category_id:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/internal_comparison_delivery_http.itemResponse'
        type: array
    type: object
  internal_consent_delivery_http.grantConsentRequest:
    properties:
      document_type:
        type: string
      version:
        type: string
    type: object
  internal_consent_delivery_http.privacyRequestPayload:
    properties:
      request_type:
        type: string
    type: object
  internal_consent_delivery_http.unsubscribeRequest:
    properties:
      token:
        maxLength: 512
        type: string
    required:
    - token
    type: object
  internal_identity_delivery_http.customerAddressRequest:
    properties:
      city:
        type: string
      country:
        type: string
      is_default:
        type: boolean
      line1:
        type: string
      line2:
        type: string
      title:
        type: string
      zip_code:
        type: string
    required:
    - city
    - country
    - line1
    - title
    - zip_code
    type: object
  internal_identity_delivery_http.customerProfilePatchRequest:
    properties:
      date_of_birth:
        type: string
      gender:
        type: string
      metadata:
        additionalProperties:
          items:
            format: int32
            type: integer
          type: array
        type: object
    type: object
  internal_identity_delivery_http.loginRequest:
    properties:
      email:
        description: Backward-compatible client alias.
        type: string
      login:
        type: string
      password:
        type: string
    required:
    - password
    type: object
  internal_identity_delivery_http.registerRequest:
    properties:
      email:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  internal_identity_delivery_http.sessionResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      role:
        type: string
      token_type:
        type: string
      user_id:
        type: string
    type: object
  internal_reports_delivery_http.rebuildRequest:
    properties:
      from:
        type: string
      to:
        type: string
    required:
    - from
    - to
    type: object
  internal_returns_delivery_http.createRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_returns_delivery_http.itemRequest'
        maxItems: 50
        minItems: 1
        type: array
      order_id:
        type: string
      refund_mode:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_returns_domain.RefundMode'
    required:
    - items
    - order_id
    type: object
  internal_returns_delivery_http.itemRequest:
    properties:
      condition:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_returns_domain.ItemCondition'
      quantity:
        maximum: 10000
        minimum: 1
        type: integer
      reason:
        maxLength: 2000
        type: string
      variant_id:
        type: string
    required:
    - condition
    - quantity
    - variant_id
    type: object
  internal_returns_delivery_http.reasonRequest:
    properties:
      reason:
        maxLength: 2000
        type: string
    type: object
  internal_reviews_delivery_http.createRequest:
    properties:
      comment:
        type: string
      rating:
        type: integer
    type: object
  internal_support_delivery_http.createTicketRequest:
    properties:
      body:
        type: string
      email:
        type: string
      subject:
        type: string
    type: object
  internal_support_delivery_http.messageRequest:
    properties:
      body:
        type: string
    type: object
  internal_video_delivery_http.attachPlacementRequest:
    properties:
      is_visible:
        type: boolean
      position:
        type: integer
      role:
        type: string
      video_asset_id:
        type: string
    required:
    - role
    - video_asset_id
    type: object
  internal_video_delivery_http.createDirectUploadRequest:
    properties:
      max_duration_seconds:
        type: integer
    type: object
  internal_video_delivery_http.updatePlacementRequest:
    properties:
      is_visible:
        type: boolean
      position:
        type: integer
    type: object
info:
  contact: {}
  description: Backend API for AquaWheel e-commerce project.
  title: AquaWheel Store API
  version: "1.0"
paths:
  /api/{lang}/cart:
    get:
      description: Resolves the authenticated customer, or the anonymous buyer's cart_session
        cookie, issuing one when absent.
      parameters:
      - description: Locale code
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Cart'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the current cart
      tags:
      - Cart
  /api/{lang}/cart/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: Locale code
        in: path
        name: lang
        required: true
        type: string
      - description: Cart item
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_cart_delivery_http.itemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Cart'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a variant to the cart
      tags:
      - Cart
  /api/{lang}/cart/items/{variantID}:
    delete:
      parameters:
      - description: Locale code
        in: path
        name: lang
        required: true
        type: string
      - description: Product variant UUID
        in: path
        name: variantID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Cart'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a variant from the cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      parameters:
      - description: Locale code
        in: path
        name: lang
        required: true
        type: string
      - description: Product variant UUID
        in: path
        name: variantID
        required: true
        type: string
      - description: New quantity
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_cart_delivery_http.itemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_cart_domain.Cart'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Replace the quantity of one cart line
      tags:
      - Cart
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: The login field accepts an email or a phone number. Failed attempts
        cost the same as successful ones, so timing does not reveal whether an account
        exists.
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_identity_delivery_http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity_delivery_http.sessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exchange credentials for an access token
      tags:
      - Auth
  /api/auth/oauth/{provider}/callback:
    get:
      description: Called by the provider. A guest cart in the request cookie is carried
        into the authenticated session.
      parameters:
      - description: Provider code
        enum:
        - google
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: Opaque state issued at the start of the flow
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity_delivery_http.sessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete an OAuth sign-in
      tags:
      - Auth
  /api/auth/oauth/{provider}/login:
    get:
      description: Redirects to the provider. Returns 404 where the deployment has
        configured no OAuth provider.
      parameters:
      - description: Provider code
        enum:
        - google
        in: path
        name: provider
        required: true
        type: string
      responses:
        "302":
          description: Redirect to the provider
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start an OAuth sign-in
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Accepts an email, a phone number, or both. Returns a session immediately;
        the account starts unverified.
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_identity_delivery_http.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_identity_delivery_http.sessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a customer account
      tags:
      - Auth
  /api/comparison:
    get:
      description: One list per category, scoped to the authenticated customer or
        the anonymous cart_session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/internal_comparison_delivery_http.listResponse'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the current buyer's comparison lists
      tags:
      - Comparison
  /api/comparison/{variant_id}:
    delete:
      parameters:
      - description: Product variant UUID
        in: path
        name: variant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a product variant from its comparison list
      tags:
      - Comparison
    post:
      description: Rejected once the list reaches COMPARISON_MAX_ITEMS.
      parameters:
      - description: Product variant UUID
        in: path
        name: variant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a product variant to its category comparison list
      tags:
      - Comparison
  /api/me/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized

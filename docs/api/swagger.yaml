      error:
        example: Bad Request
        type: string
      message:
        example: MIME type is not allowed
        type: string
    type: object
  internal_identity_delivery_http.customerAddressRequest:
    properties:
      city:
        type: string
      country:
        type: string
      is_default:
        type: boolean
      line1:
        type: string
      line2:
        type: string
      title:
        type: string
      zip_code:
        type: string
    required:
    - city
    - country
    - line1
    - title
    - zip_code
    type: object
  internal_identity_delivery_http.customerProfilePatchRequest:
    properties:
      date_of_birth:
        type: string
      gender:
        type: string
      metadata:
        additionalProperties:
          items:
            format: int32
            type: integer
          type: array
        type: object
    type: object
  internal_reports_delivery_http.rebuildRequest:
    properties:
      from:
        type: string
      to:
        type: string
    required:
    - from
    - to
    type: object
  internal_returns_delivery_http.createRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_returns_delivery_http.itemRequest'
        maxItems: 50
        minItems: 1
        type: array
      order_id:
        type: string
      refund_mode:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_returns_domain.RefundMode'
    required:
    - items
    - order_id
    type: object
  internal_returns_delivery_http.itemRequest:
    properties:
      condition:
        $ref: '#/definitions/github_com_VladHrytsaiuk_ecommerce-core_internal_returns_domain.ItemCondition'
      quantity:
        maximum: 10000
        minimum: 1
        type: integer
      reason:
        maxLength: 2000
        type: string
      variant_id:
        type: string
    required:
    - condition
    - quantity
    - variant_id
    type: object
  internal_returns_delivery_http.reasonRequest:
    properties:
      reason:
        maxLength: 2000
        type: string
    type: object
  internal_shipment_delivery_http.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  internal_user_delivery_http.ErrorResponse:
    properties:
      error:
        example: Unauthorized
        type: string
      message:
        example: Детальний опис помилки
        type: string
    type: object
  internal_wishlist_delivery_http.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for AquaWheel e-commerce project.
  title: AquaWheel Store API
  version: "1.0"
paths:
  /api/{lang}/cart:
    get:
      consumes:
      - application/json
      description: Get the shopping cart with all items and calculated totals. Uses
        JWT token for authenticated users or guest_session cookie for anonymous users.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get cart
      tags:
      - Cart
  /api/{lang}/cart/items:
    post:
      consumes:
      - application/json
      description: Add a product variation to the cart. If the item already exists,
        its quantity will be incremented.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Item to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AddToCartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /api/{lang}/cart/items/{variationId}:
    delete:
      consumes:
      - application/json
      description: Remove a product variation from the cart.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      description: Set the quantity of a specific product variation in the cart.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      - description: New quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /api/{lang}/cart/promo:
    delete:
      description: Remove applied promotional code from the cart
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Remove promo code
      tags:
      - Cart
    post:
      consumes:
      - application/json
      description: Apply a promotional code to the cart
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Promo code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.ApplyPromoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Apply promo code
      tags:
      - Cart
  /api/{lang}/cart/sync:
    post:
      consumes:
      - application/json
      description: Moves all items from anonymous session cart to the authenticated
        user's cart. Quantities are merged if items overlap.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Optional session_id to sync from (falls back to cookie)
        in: body
        name: body
        schema:
          $ref: '#/definitions/http.SyncCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Sync anonymous cart to user
      tags:
      - Cart
  /api/{lang}/wishlist:
    get:
      consumes:
      - application/json
      description: Get the list of product variations in the wishlist. Uses JWT token
        for authenticated users or wishlist_session cookie for anonymous users.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []WishlistItemResponse'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get wishlist items
      tags:
      - Wishlist
  /api/{lang}/wishlist/{variationId}:
    delete:
      consumes:
      - application/json
      description: Remove a product variation from the wishlist.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Remove item from wishlist
      tags:
      - Wishlist
    post:
      consumes:
      - application/json
      description: Add a product variation to the wishlist. Idempotent — adding the
        same item twice is a no-op.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Add item to wishlist
      tags:
      - Wishlist
  /api/{lang}/wishlist/sync:
    post:
      consumes:
      - application/json
      description: Moves all items from anonymous session (identified by cookie or
        body) to the authenticated user's wishlist.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Optional session_id to sync from (falls back to cookie)
        in: body
        name: body
        schema:
          $ref: '#/definitions/http.SyncWishlistRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Sync anonymous wishlist to user
      tags:
      - Wishlist
  /api/admin/auth/login:
    post:
      consumes:
      - application/json
      description: Логін виключно для ролі Admin
      parameters:
      - description: Дані для входу
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успішний вхід
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Невалідний запит
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
        "401":
          description: Невірний email або пароль
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
        "403":
          description: Заборонено
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
        "500":
          description: Внутрішня помилка сервера
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
      summary: Логін для адміністраторів
      tags:
      - Admin Auth
  /api/admin/auth/refresh:
    post:
      consumes:
      - application/json
      description: Повертає нові access/refresh токени за валідним старим refresh_token
        з перевіркою ролі Admin
      parameters:
      - description: Refresh токен
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Нові токени успішно згенеровані
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Токен обов'язковий
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
        "401":
          description: Refresh токен недійсний або прострочений
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
        "403":
          description: Заборонено
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
        "500":
          description: Внутрішня помилка сервера
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
      summary: Оновлення токенів для адміністраторів
      tags:
      - Admin Auth
  /api/admin/feedbacks:
    get:
      description: Returns a paginated list of feedbacks (Admin only)
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_feedback_delivery_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_feedback_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_feedback_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get list of feedbacks
      tags:
      - Admin Feedback
  /api/admin/promos:
    get:
      description: Get a paginated list of promo codes
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: List promo codes
      tags:
      - Admin Promo
    post:
      consumes:
      - application/json
      description: Create a new promotional code with specific rules
      parameters:
      - description: Promo details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CreatePromoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.PromoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Create a new promo code
      tags:
      - Admin Promo
  /api/admin/promos/{id}:
    delete:
      description: Delete a promo code
      parameters:
      - description: Promo ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Delete promo code
      tags:
      - Admin Promo
    get:
      description: Returns promo code details including relations
      parameters:
      - description: Promo ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PromoResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get promo code by ID
      tags:
      - Admin Promo
    put:
      consumes:
      - application/json
      description: Update an existing promo code
      parameters:
      - description: Promo ID
        in: path
        name: id
        required: true
        type: string
      - description: Update fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdatePromoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PromoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_discount_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Update promo code
      tags:
      - Admin Promo
  /api/admin/shipment/rules:
    post:
      consumes:
      - application/json
      description: Оновлює або створює правило доставки (напр. 'all' для безкоштовної
        доставки, 'min_order' для мін. суми замовлення)
      parameters:
      - description: Дані правила
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateShippingRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_shipment_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_shipment_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Оновити правило доставки
      tags:
      - Admin
      - Shipment
  /api/admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.UserResponse'
            type: array
      security:
      - bearerAuth: []
      summary: Список адміністраторів
      tags:
      - Admin Users
    post:
      consumes:
      - application/json
      description: Створює активний акаунт з початковим паролем без email-запрошення.
      parameters:
      - description: Дані адміністратора
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.UserResponse'
      security:
      - bearerAuth: []
      summary: Створити адміністратора або Власника
      tags:
      - Admin Users
  /api/admin/users/{id}:
    delete:
      description: Доступно лише Власнику. Видаляє звичайного адміністратора та завершує
        його сесії.
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      summary: Видалити адміністратора
      tags:
      - Admin Users
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Генерує код для скидання пароля та відправляє його на вказаний
        email.
      parameters:
      - description: Email користувача
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Лист із кодом успішно відправлено
          schema:
            $ref: '#/definitions/http.MessageResponse'
        "400":
          description: Невалідний email
          schema:
            $ref: '#/definitions/internal_user_delivery_http.ErrorResponse'
        "404":
          description: Користувача не знайдено

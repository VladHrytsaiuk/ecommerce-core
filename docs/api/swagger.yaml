        $ref: '#/definitions/pagination.Metadata'
    type: object
info:
  contact: {}
  description: Backend API for AquaWheel e-commerce project.
  title: AquaWheel Store API
  version: "1.0"
paths:
  /admin/orders:
    get:
      consumes:
      - application/json
      description: Get a paginated and filtered list of orders
      parameters:
      - description: Filter by Status ID
        in: query
        name: status_id
        type: integer
      - description: Search by number, email, phone, name
        in: query
        name: search
        type: string
      - description: From date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Sort field (created_at, total_price)
        in: query
        name: sort_by
        type: string
      - description: Sort direction (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pagination.PagedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/http.AdminOrderListResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List orders (Admin)
      tags:
      - Admin Orders
  /admin/orders/{id}:
    get:
      consumes:
      - application/json
      description: Get full details of an order including history
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AdminOrderDetailsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get order details (Admin)
      tags:
      - Admin Orders
  /admin/orders/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancel an order
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel order (Admin)
      tags:
      - Admin Orders
  /admin/orders/{id}/comment:
    put:
      consumes:
      - application/json
      description: Update the internal admin comment for an order
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Comment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateAdminCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update admin comment
      tags:
      - Admin Orders
  /admin/orders/{id}/confirm:
    post:
      consumes:
      - application/json
      description: Confirm order and create TTN
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ConfirmOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm order (Admin)
      tags:
      - Admin Orders
  /admin/orders/statuses:
    get:
      consumes:
      - application/json
      description: Get list of all available order statuses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.OrderStatusDTO'
            type: array
      security:
      - BearerAuth: []
      summary: Get order statuses
      tags:
      - Admin Orders
  /api/{lang}/cart:
    get:
      consumes:
      - application/json
      description: Get the shopping cart with all items and calculated totals. Uses
        JWT token for authenticated users or guest_session cookie for anonymous users.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get cart
      tags:
      - Cart
  /api/{lang}/cart/items:
    post:
      consumes:
      - application/json
      description: Add a product variation to the cart. If the item already exists,
        its quantity will be incremented.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Item to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AddToCartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /api/{lang}/cart/items/{variationId}:
    delete:
      consumes:
      - application/json
      description: Remove a product variation from the cart.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      description: Set the quantity of a specific product variation in the cart.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      - description: New quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /api/{lang}/cart/promo:
    delete:
      description: Remove applied promotional code from the cart
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Remove promo code
      tags:
      - Cart
    post:
      consumes:
      - application/json
      description: Apply a promotional code to the cart
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Promo code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.ApplyPromoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Apply promo code
      tags:
      - Cart
  /api/{lang}/cart/sync:
    post:
      consumes:
      - application/json
      description: Moves all items from anonymous session cart to the authenticated
        user's cart. Quantities are merged if items overlap.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Optional session_id to sync from (falls back to cookie)
        in: body
        name: body
        schema:
          $ref: '#/definitions/http.SyncCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Sync anonymous cart to user
      tags:
      - Cart
  /api/{lang}/documents/by-slug/{slug}:
    get:
      description: Get a document's localized active content by its slug
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Document slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PublicDocumentResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get document by slug
      tags:
      - Documents
  /api/{lang}/orders:
    post:
      consumes:
      - application/json
      description: Creates an order from the current cart. Supports both authenticated
        users and guests.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Order details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.CreateOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Create a new order
      tags:
      - Orders
  /api/{lang}/orders/{id}:
    get:
      description: Returns order details by UUID
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.OrderResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get order by ID
      tags:
      - Orders
  /api/{lang}/orders/{id}/cancel:
    post:
      description: Cancels an order. Only allowed for the owner of the order before
        TTN is created.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Cancel my order
      tags:
      - Orders
  /api/{lang}/orders/{id}/payment-status:
    get:
      description: Lightweight endpoint to poll payment status by order ID. Returns
        status as "pending", "paid", or "failed".
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.OrderPaymentStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      summary: Get payment status
      tags:
      - Orders
  /api/{lang}/orders/my:
    get:
      description: Returns list of orders for the authenticated user
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_order_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get my orders
      tags:
      - Orders
  /api/{lang}/wishlist:
    get:
      consumes:
      - application/json
      description: Get the list of product variations in the wishlist. Uses JWT token
        for authenticated users or wishlist_session cookie for anonymous users.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []WishlistItemResponse'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_wishlist_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get wishlist items

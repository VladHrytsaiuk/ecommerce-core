        type: integer
      product_ids:
        items:
          type: string
        type: array
      starts_at:
        type: string
      usage_limit:
        type: integer
      usage_limit_per_user:
        type: integer
    type: object
  http.UpdateShippingRuleRequest:
    properties:
      min_order_amount:
        minimum: 0
        type: integer
      provider:
        type: string
    required:
    - provider
    type: object
  http.UpdateUserRequest:
    properties:
      first_name:
        example: Іван
        type: string
      last_name:
        example: Франко
        type: string
      phone:
        example: "+380991112233"
        type: string

  internal_cart_delivery_http.ErrorResponse:
    properties:
      details: {}
      error:
        type: string
      message:
        type: string
    type: object
  internal_cart_delivery_http.UnitResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      short_name:
        type: string
    type: object
  internal_discount_delivery_http.ErrorResponse:
    properties:
      details: {}
      error:
        type: string
      message:
        type: string
    type: object
  internal_feedback_delivery_http.ErrorResponse:
    properties:
      error:
        example: Bad Request
        type: string
      message:
        example: MIME type is not allowed

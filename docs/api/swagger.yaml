    properties:
      code:
        type: string
      field:
        type: string
    type: object
  apiresponse.PageMetadata:
    properties:
      facets:
        additionalProperties:
          additionalProperties:
            type: integer
          type: object
        description: |-
          Facets is populated by Search only. Keeping it in the standard metadata
          preserves one collection envelope for all v1 clients.
        type: object
      has_next:
        type: boolean
      has_previous:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object

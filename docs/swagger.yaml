      area_name:
        example: Київська
        type: string
      area_ref:
        example: 71000000-0000-0000-0000-000000000000
        type: string
      city_name:
        example: Київ
        type: string
      city_ref:
        example: 8d5a980d-391c-11dd-90d9-001a92567626

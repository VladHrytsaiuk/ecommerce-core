        type: string
      meta_description_uk:
        type: string
      meta_keywords_en:
        type: string
      meta_keywords_uk:
        type: string
      meta_title_en:
        type: string
      meta_title_uk:
        type: string
      name_en:
        type: string
      name_uk:
        type: string
      parent_id:

tags:
- description: Адмін-панель (модерація, налаштування)
  name: Admin
- description: Аутентифікація та реєстрація
  name: Auth
- description: Профіль користувача
  name: Users
- description: Збережені адреси доставки
  name: Addresses
- description: Каталог товарів (товари, бренди, категорії, відгуки)
  name: Products

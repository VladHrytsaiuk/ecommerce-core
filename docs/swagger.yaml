info:
  contact: {}
  description: Backend API for AquaWheel e-commerce project.
  title: AquaWheel Store API
  version: "1.0"
paths:
  /api/{lang}/attributes:
    get:
      description: Get a list of all attributes
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.AttributeResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_product_delivery_http.ErrorResponse'
      summary: Get attributes
      tags:
      - Products
  /api/{lang}/brands:
    get:
      description: Get a list of all active brands
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.BrandResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_product_delivery_http.ErrorResponse'
      summary: Get brands
      tags:
      - Products
  /api/{lang}/cart:
    get:
      consumes:
      - application/json
      description: Get the shopping cart with all items and calculated totals. Uses
        JWT token for authenticated users or guest_session cookie for anonymous users.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get cart
      tags:
      - Cart
  /api/{lang}/cart/items:
    post:
      consumes:
      - application/json
      description: Add a product variation to the cart. If the item already exists,
        its quantity will be incremented.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Item to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AddToCartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /api/{lang}/cart/items/{variationId}:
    delete:
      consumes:
      - application/json
      description: Remove a product variation from the cart.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      description: Set the quantity of a specific product variation in the cart.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Product Variation UUID
        in: path
        name: variationId
        required: true
        type: string
      - description: New quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /api/{lang}/cart/promo:
    delete:
      description: Remove applied promotional code from the cart
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Remove promo code
      tags:
      - Cart
    post:
      consumes:
      - application/json
      description: Apply a promotional code to the cart
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang
        required: true
        type: string
      - description: Promo code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.ApplyPromoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_cart_delivery_http.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Apply promo code
      tags:
      - Cart
  /api/{lang}/cart/sync:
    post:
      consumes:
      - application/json
      description: Moves all items from anonymous session cart to the authenticated
        user's cart. Quantities are merged if items overlap.
      parameters:
      - description: Language code (uk, en)
        in: path
        name: lang

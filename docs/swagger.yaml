      description: Receives payment callback from LiqPay. No authentication — validated
        by signature.
      parameters:
      - description: Base64-encoded JSON payload
        in: formData
        name: data
        required: true
        type: string
      - description: LiqPay signature
        in: formData
        name: signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: LiqPay payment webhook
      tags:
      - Webhooks

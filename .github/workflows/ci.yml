name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout=5m
      - name: Verify generated OpenAPI contract
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init \
            -g cmd/api/main.go --parseDependency --parseInternal \
            --output docs/api
          git diff --exit-code -- docs/api
      - name: Verify active clean architecture
        run: bash scripts/check-clean-architecture.sh
      - name: Verify every package is reachable
        run: bash scripts/check-package-reachability.sh
      # Two rules. PostgreSQL indexes the referenced side of a foreign key,
      # never the referencing side, and six such columns here were sequential
      # scans on paths that run per order or per page view. And a reference
      # inside one module that is not a foreign key stores a wrong identifier
      # with no error at all: support_messages carried a zero ticket_id for the
      # life of the table, so every ticket's opening message was invisible.
      - name: Verify foreign keys are indexed and declared
        run: python3 scripts/check-foreign-key-indexes.py
      # Neither vet nor staticcheck knows anything about published advisories.
      # The first run of this found nine reachable vulnerabilities in a 2019
      # golang.org/x/image, every one of them on the path that decodes images
      # a customer uploads.
      - name: Check dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      # Integration-tagged files are excluded from a normal build, so nothing
      # else notices when one stops compiling. Vet stops at the first broken
      # package, so a single stale test can mask every other one.
      - name: Vet integration-tagged tests
        run: go vet -tags=integration ./...
      # Unreachable code accumulated to roughly twenty thousand lines before it
      # was noticed, because nothing failed while it still compiled.
      - name: Report unused exported-free code
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck -checks U1000 ./...

  test:
    name: race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Docker daemon for Testcontainers
        run: docker info
      - name: Run tests with the race detector
        run: go test -race ./...
      # Previously only two packages ran here, so integration coverage added
      # elsewhere never executed in CI.
      - name: Run the integration suite against real PostgreSQL
        run: go test -tags=integration -count=1 ./...

  build:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image without publishing
        run: docker build --tag ecommerce-core:ci .

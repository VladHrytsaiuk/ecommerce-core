services:
  # Optional distributed cache/rate-limit backend. Enable explicitly with
  # `docker compose --profile redis up` and REDIS_ENABLED=true.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles: ["redis"]
    restart: unless-stopped

  # Product-search projection. It is opt-in and stores no transactional source
  # of truth; enable with `docker compose --profile search up`.
  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_ENV: production
      # The application refuses to enable Search without SEARCH_MASTER_KEY.
      # A local-only fallback keeps unrelated Compose profiles usable.
      MEILI_MASTER_KEY: ${SEARCH_MASTER_KEY:-development-master-key-change-before-production}
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles: ["search"]
    restart: unless-stopped

  # Local S3-compatible object storage for the opt-in Media module. Production
  # may instead point the same adapter at AWS S3 or Cloudflare R2.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_ACCESS_KEY:-minioadmin-change-before-production}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9002:9001"
    profiles: ["media"]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/$$MEDIA_S3_BUCKET
      && mc anonymous set download local/$$MEDIA_S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_ACCESS_KEY:-minioadmin-change-before-production}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-ecommerce-media}
    depends_on:
      minio:
        condition: service_started
    profiles: ["media"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_core}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      APP_ENV: production
      # Keep operational endpoints reachable only on the Compose network.
      MANAGEMENT_ADDR: ":9090"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-tempo:4318}
      # Containers resolve the opt-in Search service by Docker DNS; local
      # `go run` continues to use SEARCH_URL from .env (localhost:7700).
      SEARCH_URL: ${SEARCH_COMPOSE_URL:-http://meilisearch:7700}
      SEARCH_MASTER_KEY: ${SEARCH_MASTER_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  # Start with `OTEL_ENABLED=true docker compose --profile observability up`.
  # Prometheus reaches the private management listener over the Compose network;
  # port 9090 is deliberately not published to the host.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - api
    profiles: ["observability"]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    profiles: ["observability"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # This fallback is safe only for the loopback-bound local profile.
      # Production must provide a unique secret through deployment tooling.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-for-local-observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - tempo
    profiles: ["observability"]
    restart: unless-stopped

  # Maintenance commands run on the same internal network as PostgreSQL and
  # are opt-in, so a normal `docker compose up` never starts this container.
  cli:
    build:
      context: .
      target: cli
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  meilisearch-data:
  minio-data:
